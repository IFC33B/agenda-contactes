@if (carregant) {
  <div class="flex justify-center items-center h-64">
    <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
  </div>
}

@if (contactes.length === 0) {
<section class="flex justify-center h-1/2">
    <h1 class="my-auto text-4xl font-bold">No hay contacto, añade alguno!</h1>
</section>

} @else {
<!-- Lista de Contactos -->
<section class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    @for (contacte of contactes; track contacte.id) {
    <!-- Card de Contacto -->
    <div class="bg-gray-800 rounded-lg shadow p-4 hover:bg-gray-700 transition">
        <h2 class="text-xl font-semibold mb-2">{{contacte.nom}}</h2>
        <p class="text-gray-300 mb-1"><strong>Email:</strong> {{contacte.email}}</p>
        <p class="text-gray-300 mb-3"><strong>Teléfono:</strong> {{contacte.telefon}}</p>
        <div class="flex justify-end gap-2">
            <button class="text-green-400 hover:text-green-500 font-semibold">Editar</button>
            <button class="text-red-400 hover:text-red-500 font-semibold">Eliminar</button>
        </div>
    </div>
    }
</section>
}
