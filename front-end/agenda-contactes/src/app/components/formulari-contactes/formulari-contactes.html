<section class="max-w-md mx-auto mt-8 bg-gray-800 p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-white mb-4">Añadir Contacto</h1>
    
    <form class="space-y-4" (submit)="afegirContactes()">
        <!-- Nombre -->
        <div>
            <label class="block text-gray-300 mb-1" for="nom">Nombre</label>
            <input 
                type="text" 
                id="nom" 
                name="nom" 
                class="w-full px-3 py-2 rounded-md bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Introduce el nombre"
                [(ngModel)]="nom"
            />
        </div>

        <!-- Email -->
        <div>
            <label class="block text-gray-300 mb-1" for="email">Email</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                class="w-full px-3 py-2 rounded-md bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="ejemplo@email.com"
                [(ngModel)]="email"
            />
        </div>

        <!-- Teléfono -->
        <div>
            <label class="block text-gray-300 mb-1" for="telefon">Teléfono</label>
            <input 
                type="tel" 
                id="telefon" 
                name="telefon" 
                class="w-full px-3 py-2 rounded-md bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="123-456-789"
                [(ngModel)]="telefon"
            />
        </div>

        <!-- Botón -->
        <div class="flex justify-end">
            <button 
                type="submit" 
                class="bg-blue-500 hover:bg-blue-600 text-white font-semibold px-4 py-2 rounded-md transition"
            >
                Añadir
            </button>
        </div>
    </form>
</section>
